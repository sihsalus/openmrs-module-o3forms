name: Build and test SIH Salus O3 Forms

on:
  push:
    branches: [sihsalus/2.3.x]
  pull_request:
    branches: [sihsalus/2.3.x]

permissions:
  contents: read

concurrency:
  group: o3forms-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'sihsalus/openmrs-module-o3forms'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test the complete reactor
        run: mvn --batch-mode --no-transfer-progress -Dformatter.skip=true -Dimpsort.skip=true clean verify
      - name: Check for unexpected build changes
        run: git diff --exit-code
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-reports-${{ github.sha }}
          path: '*/target/surefire-reports/TEST-*.xml'
          retention-days: 7
      - name: Upload candidate for review (not a release)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: o3forms-candidate-${{ github.sha }}
          path: omod/target/o3forms-2.3.0-sihsalus.1.omod
          if-no-files-found: error
          retention-days: 7
